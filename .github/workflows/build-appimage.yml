name: Build AppImage

on:
  push:
    branches:
      - '*'
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'
  release:
    types: [published]

jobs:
  appimage-x86_64:
    name: Linux AppImage (64-bit)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-xinerama0 libgl1 libfuse2 libbluetooth-dev
      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install -e ".[can,network,bluetooth]"
      - name: Build AppImage
        run: |
          bash setup_tools/appimage/build.sh "${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v7
        with:
          name: ddt4all-x86_64.AppImage
          path: ddt4all-*-x86_64.AppImage
          if-no-files-found: error
      - if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: ddt4all-*-x86_64.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  appimage-x86_32:
    name: Linux AppImage (32-bit)
    runs-on: ubuntu-24.04
    container:
      image: i386/debian:12
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

    steps:
      - name: Checkout
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apt-get update && apt-get install -y git
          git clone --depth 1 --branch "${{ github.ref_name }}" \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" .
      - name: Install system deps
        run: |
          apt-get install -y python3 python3-pip python3-venv python3-pyqt5 \
            python3-serial python3-usb python3-crcmod \
            libxcb-xinerama0 libgl1 libfuse2 squashfs-tools file wget
      - name: Install Python deps
        run: |
          python3 -m venv /opt/venv
          . /opt/venv/bin/activate
          pip install --upgrade pip
          pip install --no-deps polib platformdirs
          pip install --no-deps -e ".[can,network,bluetooth]"
      - name: Build AppImage
        run: |
          . /opt/venv/bin/activate
          bash setup_tools/appimage/build.sh "${GITHUB_REF_NAME}" x86_32
      - name: Upload AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apt-get install -y zip
          zip -j artifact.zip ddt4all-*-x86_32.AppImage
          curl -s -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/zip" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?name=ddt4all-x86_32" \
            --data-binary @artifact.zip
      - if: github.ref_type == 'tag'
        name: Upload to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apt-get install -y gh
          gh release upload "${{ github.ref_name }}" ddt4all-*-x86_32.AppImage --clobber
